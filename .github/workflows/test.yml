name: Validate paper bot
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/state.json'
      - 'docs/state.json'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check docs/app.js
