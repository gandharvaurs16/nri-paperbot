name: Two-year backtest
on:
  workflow_dispatch:
    inputs:
      start:
        description: First replay date (YYYY-MM-DD)
        required: true
        default: '2024-09-28'
      end:
        description: Last replay date (YYYY-MM-DD)
        required: true
        default: '2026-09-27'
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run point-in-time replay
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5-5
        run: python -m bot.main --backtest --from-date '${{ inputs.start }}' --date '${{ inputs.end }}'
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: backtest-report
          path: data/backtest_output.json
